<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application</title>
    <!-- Taiilwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


    <style>

        /* Font */
        body{
            background-color: #F8FAFC;
        }
        *{
            
            font-family: "Geist", sans-serif;
        }
        button{
            cursor: pointer;
        }
    </style>
  </head>
  </head>
  <body>

    <header class="container mx-auto p-6">

        <h1 class="text-3xl font-bold my-5 ">Job Application</h1>

        <section class="container mx-auto text-center sm:text-left  grid sm:grid-cols-3 grid-cols-1 gap-4">
        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-gray-500 text-sm">Total Jobs</h2>
            <p id="totalJobCount" class="text-2xl font-bold">0</p>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-blue-500 text-sm">Interview</h2>
            <p id="interviewCount" class="text-2xl font-bold">0</p>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-red-500 text-sm">Rejected</h2>
            <p id="rejectedCount" class="text-2xl font-bold">0</p>
        </div>
    </section>

        <hr class="my-5 text-gray-200">

    </header>

    <main class="container mx-auto p-6">
        <!-- Avalable jobs -->
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Available Jobs</h2>
            <span id="tabCount" class="text-gray-500 text-sm">8 Jobs</span>
        </div>
        <!-- Filterred btn -->
        <div class="flex gap-4 ">   
            <button onclick="tabButton(event,'All')" class="tab-btn bg-black text-white py-2 px-4 rounded">All</button>
            <button onclick="tabButton(event,'Interview')" class="tab-btn bg-gray-200 py-2 px-4 rounded">Interview</button>
            <button onclick="tabButton(event,'Rejected')" class="tab-btn bg-gray-200 py-2 px-4 rounded">Rejected</button>
        </div>
       



        <!--  Cards Container -->
        <div id="jobsContainer" class=" gap-6"></div>



          <!-- Empty Design -->
        <div id="emptyState" class="hidden text-center mt-10">
            <img src="./images/empty.png" 
                 class="mx-auto w-24 opacity-50 mb-4">
            <h3 class="text-lg font-semibold">No Jobs Available</h3>
            <p class="text-gray-500 text-sm">You haven’t added any job here yet.</p>
        </div>

    </main>

    <!-- Script File -->
    <script src="./script.js"></script>
  </body>
</html>
