<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application</title>
    <!-- Taiilwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


    <style>

        /* Font */
        body{
            background-color: #F8FAFC;
        }
        *{
            
            font-family: "Geist", sans-serif;
        }
        button{
            cursor: pointer;
        }
    </style>
  </head>
  </head>
  <body>

    <header class="container mx-auto">

        <h1 class="text-3xl font-bold mt-5 ">Job Application Tracker</h1>

        <div class="dashbord flex gap-5 mt-5 justify-between ">

            <div class="card bg-[#FFFFFF] flex-1 p-4 rounded shadow">
                <p>Total</p>
                <p id="totalJobCount">8</p>
            </div>
            <div class="card bg-[#FFFFFF] flex-1 p-4 rounded shadow ">
                <p>Interview</p>
                <p id="interviewCount">0</p>
            </div>
            <div class="card bg-[#FFFFFF] flex-1 p-4  rounded shadow">
                <p>Rejected</p>
                <p id="rejectedCount">0</p>
            </div>

        </div>

        <hr class="my-5 text-gray-200">

    </header>

    <main class="container mx-auto">
        <!-- Avalable jobs -->
        <!-- Filterred btn -->
        <div class="flex gap-4 ">   
            <button onclick="tabButton(event,'All')" class="tab-btn bg-black text-white py-2 px-4 rounded">All</button>
            <button onclick="tabButton(event,'Interview')" class="tab-btn bg-gray-200 py-2 px-4 rounded">Interview</button>
            <button onclick="tabButton(event,'Rejected')" class="tab-btn bg-gray-200 py-2 px-4 rounded">Rejected</button>
        </div>



          <!-- Empty Design -->
        <div id="emptyState" class="hidden text-center mt-10">
            <img src="./images/empty.png" 
                 class="mx-auto w-24 opacity-50 mb-4">
            <h3 class="text-lg font-semibold">No Jobs Available</h3>
            <p class="text-gray-500 text-sm">You haven’t added any job here yet.</p>
        </div>

    </main>

    <!-- Script File -->
    <script src="./script.js"></script>
  </body>
</html>
